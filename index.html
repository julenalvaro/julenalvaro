<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivial Marcador</title>
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #23252b;
    --ink-soft: #6b6e78;
    --line: #e0ddd4;
    --answer-bg: #eef0e9;
    --geo: #2e6fb5;
    --his: #d9a417;
    --cie: #3d8f4e;
    --dep: #d96c2a;
    --cin: #c2517e;
    --lit: #8a6a4e;
    --chip-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1e24;
      --card: #262932;
      --ink: #ecebe5;
      --ink-soft: #9a9daa;
      --line: #383c48;
      --answer-bg: #2f3440;
      --geo: #5b95d6;
      --his: #e0b23f;
      --cie: #5fae70;
      --dep: #e08a50;
      --cin: #d980a4;
      --lit: #b3906c;
      --chip-ink: #1c1e24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1e24;
    --card: #262932;
    --ink: #ecebe5;
    --ink-soft: #9a9daa;
    --line: #383c48;
    --answer-bg: #2f3440;
    --geo: #5b95d6;
    --his: #e0b23f;
    --cie: #5fae70;
    --dep: #e08a50;
    --cin: #d980a4;
    --lit: #b3906c;
    --chip-ink: #1c1e24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap {
    width: 100%;
    max-width: 680px;
    padding: 20px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 1.15rem;
    margin: 0;
    letter-spacing: 0.02em;
  }
  h1 .dots span {
    display: inline-block;
    width: 0.55em; height: 0.55em;
    border-radius: 50%;
    margin-left: 4px;
  }
  .counter {
    color: var(--ink-soft);
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filters button {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
  }
  .filters button.active { border-color: currentColor; font-weight: 600; }
  .filters button.f-geo.active { color: var(--geo); }
  .filters button.f-his.active { color: var(--his); }
  .filters button.f-cie.active { color: var(--cie); }
  .filters button.f-dep.active { color: var(--dep); }
  .filters button.f-cin.active { color: var(--cin); }
  .filters button.f-lit.active { color: var(--lit); }
  .filters button:focus-visible, .controls button:focus-visible, .card:focus-visible {
    outline: 2px solid var(--ink-soft);
    outline-offset: 2px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 320px;
    cursor: pointer;
    border-top: 6px solid var(--cat-color, var(--ink-soft));
  }
  .cat {
    align-self: flex-start;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--chip-ink);
    background: var(--cat-color, var(--ink-soft));
    border-radius: 999px;
    padding: 4px 12px;
  }
  .question {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.3rem, 4.2vw, 1.65rem);
    line-height: 1.38;
    margin: 0;
    text-wrap: balance;
    flex: 1;
  }
  .answer {
    background: var(--answer-bg);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 1.08rem;
    line-height: 1.4;
  }
  .answer .fact {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 0.88rem;
    color: var(--ink-soft);
    line-height: 1.45;
  }
  .answer.hidden-answer {
    color: var(--ink-soft);
    background: transparent;
    border: 1px dashed var(--line);
    text-align: center;
    font-size: 0.9rem;
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    gap: 10px;
  }
  .controls button {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 10px;
    padding: 14px 8px;
    font-size: 1rem;
    cursor: pointer;
    font-family: inherit;
  }
  .controls button.primary { font-weight: 600; }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    color: var(--ink-soft);
    font-size: 0.82rem;
  }
  .footer-row button {
    border: none;
    background: none;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    font: inherit;
    padding: 4px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .card { transition: border-color 0.2s; }
  }
  .scores {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .player {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px 12px;
    flex: 1 1 150px;
    min-width: 140px;
  }
  .player.leader { border-color: var(--his); }
  .prow {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .pname {
    font-weight: 600;
    font-size: 0.95rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .player.leader .pname::after { content: " ★"; color: var(--his); }
  .pscore {
    font-size: 1.5rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .pbtns {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 8px;
  }
  .pbtns button {
    padding: 9px 0;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    font: inherit;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .pbtns button.plus { color: var(--cie); font-weight: 600; }
  .pbtns button.minus { color: var(--dep); }
  .setup {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .setup[hidden] { display: none; }
  .setup-box {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .setup-box h2 { margin: 0; font-size: 1.3rem; }
  .setup-box p { margin: 0; color: var(--ink-soft); font-size: 0.9rem; }
  .addrow { display: flex; gap: 8px; }
  .addrow input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font: inherit;
  }
  .addrow button, .setup-actions button {
    padding: 12px 18px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  .chiplist { display: flex; flex-wrap: wrap; gap: 8px; min-height: 34px; }
  .chiplist .chip {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .chiplist .chip::after { content: " ✕"; color: var(--ink-soft); font-size: 0.8em; }
  .setup-actions { display: flex; gap: 8px; }
  .setup-actions .start {
    flex: 1;
    font-weight: 600;
    border-color: var(--cie);
    color: var(--cie);
  }
  .setup-actions .start:disabled { opacity: 0.45; cursor: default; }
</style>

<div class="wrap">
  <header>
    <h1>Trivial Exprés
      <span class="dots"><span style="background:var(--geo)"></span><span style="background:var(--his)"></span><span style="background:var(--cie)"></span><span style="background:var(--dep)"></span><span style="background:var(--cin)"></span><span style="background:var(--lit)"></span></span>
    </h1>
    <div class="counter" id="counter"></div>
  </header>

  <div class="filters" id="filters">
    <button data-cat="all" class="active">Todas</button>
    <button data-cat="0" class="f-geo">Geografía</button>
    <button data-cat="1" class="f-his">Historia</button>
    <button data-cat="2" class="f-cie">Ciencia y Naturaleza</button>
    <button data-cat="3" class="f-dep">Deportes</button>
    <button data-cat="4" class="f-cin">Cine</button>
    <button data-cat="5" class="f-lit">Literatura</button>
  </div>

  <div class="card" id="card" tabindex="0" role="button" aria-label="Mostrar u ocultar la respuesta">
    <span class="cat" id="cat"></span>
    <p class="question" id="question"></p>
    <div class="answer hidden-answer" id="answer">Toca la tarjeta o pulsa «Ver respuesta»</div>
  </div>

  <div class="controls">
    <button id="prev" aria-label="Pregunta anterior">← Atrás</button>
    <button id="reveal" class="primary">Ver respuesta</button>
    <button id="next" aria-label="Pregunta siguiente">Siguiente →</button>
  </div>

  <div class="scores" id="scores"></div>

  <div class="footer-row">
    <button id="editPlayers">Jugadores</button>
    <button id="shuffle">Barajar de nuevo</button>
  </div>
</div>

<div class="setup" id="setup" hidden>
  <div class="setup-box">
    <h2>¿Quién juega?</h2>
    <p>Escribe un nombre y pulsa Enter. Toca un nombre para quitarlo.</p>
    <div class="addrow">
      <input id="nameInput" type="text" maxlength="14" placeholder="Nombre" autocomplete="off">
      <button id="addPlayer">Añadir</button>
    </div>
    <div class="chiplist" id="chiplist"></div>
    <div class="setup-actions">
      <button class="start" id="startGame" disabled>Empezar</button>
      <button id="resetScores" hidden>Puntos a cero</button>
    </div>
  </div>
</div>

<script>
const CATS = [
  { name: "Geografía",           varName: "--geo" },
  { name: "Historia",            varName: "--his" },
  { name: "Ciencia y Naturaleza",varName: "--cie" },
  { name: "Deportes",            varName: "--dep" },
  { name: "Cine",                varName: "--cin" },
  { name: "Literatura",          varName: "--lit" },
];

// [categoría, pregunta, respuesta, curiosidad (opcional)]

[1,"¿Quién fue el primer presidente de la Rusia postsoviética?","Boris Yeltsin.","Se hizo famoso subido a un tanque frente al golpe de Estado de 1991."],
[1,"¿Qué media ciudad sobrevivió en 1948-49 gracias a un puente aéreo aliado?","Berlín Oeste.","Durante casi un año aterrizó un avión con suministros cada pocos minutos."],
[1,"¿Quién fue el segundo ser humano en pisar la Luna?","Buzz Aldrin.","Bajó 19 minutos después de Armstrong; su madre, curiosamente, se apellidaba Moon de soltera."],
[1,"¿Qué reina britana lideró una gran revuelta contra los romanos en el siglo I?","Boudica, reina de los icenos.","Llegó a arrasar el Londres romano antes de ser derrotada."],
[1,"¿Qué dinastía fundó El Cairo en el año 969: los fatimíes, los otomanos o los mamelucos?","Los fatimíes.","También fundaron la mezquita-universidad de al-Azhar, aún en funcionamiento."],
[1,"¿Qué emperador bizantino dio nombre a la primera gran pandemia de peste, en el siglo VI?","Justiniano.","El mismo que mandó compilar el derecho romano en el que aún se basan nuestras leyes."],
[1,"Según la leyenda, ¿qué gemelos amamantados por una loba fundaron Roma?","Rómulo y Remo.","La fecha tradicional es el 753 a. C.; Rómulo acabó matando a su hermano."],
[1,"¿Qué satélite soviético inauguró la era espacial en 1957?","El Sputnik 1.","Era una esfera de 58 cm que solo emitía pitidos, pero desató el pánico en Estados Unidos."],
[1,"¿Qué pueblo germánico saqueó Roma en el año 410, algo que no ocurría desde hacía 800 años?","Los visigodos, al mando de Alarico.","El eco fue tal que san Agustín escribió «La ciudad de Dios» para explicarlo."],
[1,"¿Qué dinastía de origen griego gobernó Egipto tras la muerte de Alejandro Magno?","Los Ptolomeos.","Duraron tres siglos; la última de la dinastía fue Cleopatra."],
[1,"¿En qué sala juraron los diputados franceses de 1789 no disolverse hasta dar al país una constitución?","En la sala del Juego de Pelota de Versalles.","Era, literalmente, un frontón: el único sitio grande que encontraron libre."],
[1,"¿Qué ciudad aragonesa resistió dos asedios napoleónicos con Agustina de Aragón entre sus defensores?","Zaragoza.","Agustina disparó el cañón cuando los artilleros habían caído; Goya la retrató."],
[1,"¿Qué sultán otomano puso sitio a Viena en 1529?","Solimán el Magnífico.","Fue la marea alta del imperio: nunca llegaron más lejos en Europa central."],
[1,"¿Qué mercader veneciano sirvió durante años en la corte de Kublai Kan?","Marco Polo.","Dictó su libro en la cárcel de Génova, y muchos coetáneos lo tomaron por un cuentista."],
[1,"¿Qué emperador mogol mandó construir el Taj Mahal en memoria de su esposa?","Sha Jahan.","Su propio hijo lo destronó y lo encerró en un fuerte… con vistas al mausoleo."],
[1,"¿Qué conflicto del siglo XVIII se considera la primera guerra realmente mundial?","La guerra de los Siete Años (1756-1763).","Se combatió en Europa, América, África y Asia; Churchill la llamó «la primera guerra mundial»."],
[1,"¿Qué líder comunista encabezó la Larga Marcha china?","Mao Zedong.","En 1949 proclamó la República Popular China desde la plaza de Tiananmén."],
[1,"¿Sobre qué ciudad japonesa cayó la segunda bomba atómica, el 9 de agosto de 1945?","Sobre Nagasaki.","El objetivo original era Kokura, que se salvó por las nubes que la cubrían."],
[1,"¿Qué sultán recuperó Jerusalén para el islam en 1187?","Saladino.","Su caballerosidad con los vencidos impresionó tanto a los cruzados que Europa lo convirtió en leyenda."],
[1,"¿Qué rey europeo explotó el Congo como si fuera una finca privada?","Leopoldo II de Bélgica.","El Congo no era colonia belga, sino propiedad personal suya: un caso único y brutal."],
[1,"¿Qué localidad de Massachusetts celebró en 1692 sus tristemente famosos juicios por brujería?","Salem.","Diecinueve personas fueron ahorcadas; siglos después el estado las exoneró oficialmente."],
[1,"¿Qué canciller alemán se arrodilló en 1970 ante el monumento del gueto de Varsovia?","Willy Brandt.","El gesto espontáneo se considera un punto de inflexión en la reconciliación europea."],
[1,"¿En qué país comenzó la Primavera Árabe en 2010?","En Túnez.","La chispa fue la inmolación de un vendedor ambulante al que la policía confiscó su carro."],
[1,"¿Qué almirante chino del siglo XV exploró el Índico con barcos mucho mayores que los de Colón?","Zheng He.","Llegó hasta África oriental; luego China quemó su flota y se cerró al mar."],
[1,"¿En qué año crearon los Reyes Católicos la Inquisición española?","En 1478.","No se abolió definitivamente hasta 1834, tres siglos y medio después."],
[1,"¿A quiénes expulsó de España el edicto de Granada de 1492?","A los judíos que no se convirtieran.","Sus descendientes sefardíes conservaron el judeoespañol, que aún se habla."],
[1,"¿Qué gran ciudad maya de Guatemala quedó siglos oculta bajo la selva?","Tikal.","Sus pirámides sobresalen todavía hoy por encima de la copa de los árboles."],
[1,"¿Qué gesto sorprendente hizo Napoleón en su coronación de 1804?","Se coronó a sí mismo, quitándole la corona al papa.","No quería deber el imperio a nadie, ni siquiera a Dios."],
[1,"¿Qué congreso reordenó el mapa de Europa tras la caída de Napoleón?","El Congreso de Viena (1814-15).","Entre baile y baile: los diplomáticos lo apodaron «el congreso que no avanza, baila»."],
[1,"¿Qué presidente de la Segunda República española murió exiliado en Francia en 1940?","Manuel Azaña."],
[1,"¿Qué nombre en clave tuvo la invasión alemana de la Unión Soviética?","Operación Barbarroja.","Se lanzó en junio de 1941 con casi cuatro millones de soldados: la mayor invasión de la historia."],
[1,"¿Cómo se llamaron los pequeños reinos en que se fragmentó al-Ándalus tras la caída del califato?","Los reinos de taifas.","Débiles y rivales entre sí, pagaban tributos a los reinos cristianos para sobrevivir."],
[1,"¿Qué navegante dio, sin pretenderlo, su nombre al continente americano?","Américo Vespucio.","Un cartógrafo alemán escribió «América» en un mapa de 1507 y el nombre prosperó."],
[1,"¿Qué país americano eligió en 1990 a Violeta Chamorro, primera presidenta electa del continente: Nicaragua, Chile o Argentina?","Nicaragua."],
[1,"¿En qué año empezó a circular el euro en billetes y monedas?","En 2002.","España despidió la peseta tras 133 años de servicio."],
[1,"¿Qué presidente de EE. UU. exigió en Berlín: «señor Gorbachov, ¡derribe este muro!»?","Ronald Reagan, en 1987.","Dos años después, el muro cayó."],
[1,"¿Qué jefes indios aniquilaron al general Custer en Little Bighorn?","Toro Sentado y Caballo Loco, en 1876.","Fue la mayor victoria india de las guerras del Oeste… y aceleró su derrota final."],
[1,"¿Qué se descubrió en California en 1848, atrayendo a 300.000 buscadores?","Oro.","De aquella fiebre nació San Francisco… y los vaqueros Levi's, cosidos para los mineros."],
[1,"¿Qué colonia protagonizó la única revolución de esclavos triunfante de la historia, en 1804?","Haití.","Se convirtió en la primera república gobernada por antiguos esclavos."],
[1,"¿Qué dinastía reinó en Rusia durante tres siglos, hasta 1917?","Los Románov.","La familia del último zar fue fusilada al completo en un sótano de Ekaterimburgo."],
[1,"¿Qué batalla de 1824 selló el fin del dominio español en Sudamérica?","La batalla de Ayacucho, en Perú."],
[1,"¿En qué ciudad egipcia estuvo la mayor biblioteca de la Antigüedad?","En Alejandría.","La misma ciudad tenía otra maravilla: el gran faro de la isla de Faros."],
[1,"¿Qué héroe francés de la Primera Guerra Mundial acabó condenado por colaborar con los nazis?","El mariscal Philippe Pétain.","De salvador de Verdún a jefe del régimen colaboracionista de Vichy."],
[1,"¿A bordo de qué barco dio Darwin la vuelta al mundo?","Del Beagle.","El viaje iba a durar dos años y duró casi cinco; Darwin se mareaba muchísimo."],
[1,"¿Qué inventó Alfred Nobel antes de crear los premios que llevan su nombre?","La dinamita.","Un periódico publicó por error su obituario llamándolo «mercader de la muerte»: los premios fueron su respuesta."],
[1,"¿Qué presidente del Gobierno español murió en un atentado de ETA en 1973?","Luis Carrero Blanco.","La explosión lanzó su coche por encima del edificio contiguo."],
[1,"¿Qué organización internacional precedió a la ONU tras la Primera Guerra Mundial?","La Sociedad de Naciones.","Fracasó, entre otras cosas, porque Estados Unidos nunca llegó a entrar."],
[1,"¿Qué diputada logró el voto femenino en España en 1931?","Clara Campoamor.","Nueva Zelanda había sido el primer país del mundo en concederlo, en 1893."],
[1,"¿Qué batalla naval del 31 a. C. enfrentó a Octavio contra Marco Antonio y Cleopatra?","La batalla de Accio.","Los derrotados se suicidaron en Egipto y Octavio se quedó con todo: nacía el Imperio."],
[1,"¿Con qué flemática frase saludó Stanley al explorador que llevaba años perdido en África?","«El doctor Livingstone, supongo».","Livingstone, por cierto, se negó a volver: siguió buscando las fuentes del Nilo hasta morir."],
[1,"¿Qué rey de Lidia sigue siendo sinónimo de riqueza?","Creso.","En su reino se acuñaron las primeras monedas de oro y plata de la historia."],
[1,"¿Qué dos bandos se enfrentaron en la guerra civil rusa tras la revolución?","Los rojos (bolcheviques) y los blancos (zaristas y antirrevolucionarios)."],
[1,"¿Qué calendario, precursor del actual, instauró Julio César?","El calendario juliano.","El gregoriano lo corrigió en 1582: aquel año, en España, al 4 de octubre le siguió el 15."],
[1,"¿Qué rey castellano apodado «el Sabio» impulsó la Escuela de Traductores de Toledo?","Alfonso X.","En su corte convivían traductores judíos, musulmanes y cristianos."],
[1,"¿Qué queda hoy del templo de Jerusalén que Roma destruyó en el año 70?","El Muro de las Lamentaciones.","Es solo un muro de contención de la explanada, pero es el lugar más sagrado del judaísmo."],
[1,"¿En qué dos países se dividió el Raj británico al independizarse en 1947?","En India y Pakistán.","La partición desató uno de los mayores éxodos de la historia: unos 15 millones de desplazados."],
[1,"¿Qué ciudad soviética resistió un asedio alemán de casi 900 días?","Leningrado (hoy San Petersburgo).","Murió alrededor de un millón de civiles, muchos de hambre; la ciudad jamás se rindió."],
[1,"¿Qué mariscal gobernó Yugoslavia hasta 1980, manteniéndola fuera de la órbita soviética?","Josip Broz, «Tito».","Plantó cara a Stalin y fundó el Movimiento de Países No Alineados."],
[1,"¿Qué dinastía construyó la Alhambra de Granada?","Los nazaríes.","Fue el último reino musulmán de la península: cayó en 1492."],
[1,"¿Qué conquistador español buscó la fuente de la eterna juventud?","Juan Ponce de León.","No la encontró, pero por el camino descubrió Florida para los europeos."],
[1,"¿Qué flor provocó en Holanda la primera burbuja especulativa de la historia?","El tulipán.","En 1637 un solo bulbo llegó a valer más que una casa en Ámsterdam."],
[1,"¿Qué empresa privada llegó a gobernar la India con su propio ejército?","La Compañía Británica de las Indias Orientales.","La corona no asumió el control directo hasta el motín de los cipayos de 1857."],
[1,"¿Qué capital europea sufrió en los años 90 el asedio más largo de la guerra moderna?","Sarajevo, durante casi cuatro años (1992-1996)."],
[1,"¿Qué acuerdo de 1998 trajo la paz a Irlanda del Norte?","El Acuerdo de Viernes Santo."],
[1,"¿Qué electricista polaco fundó el sindicato Solidaridad y acabó siendo presidente?","Lech Walesa.","Saltó la valla de los astilleros de Gdansk para unirse a la huelga; acabó con un Nobel de la Paz."],
[1,"¿Qué pueblo de origen vikingo dio su nombre a Rusia?","Los rus o varegos.","Fundaron los principados de Nóvgorod y Kiev en el siglo IX."],
[1,"¿Qué potencia derrotó a China en las guerras del Opio del siglo XIX?","Reino Unido.","Como botín se quedó Hong Kong, que no devolvió hasta 1997."],
[1,"¿Qué dos caudillos populares lideraron la Revolución mexicana?","Pancho Villa y Emiliano Zapata.","Ambos murieron emboscados; el lema zapatista era «tierra y libertad»."],
[1,"¿Qué civilización construyó la ciudad de Teotihuacán?","No se sabe: es uno de los grandes misterios de América.","Cuando llegaron los aztecas ya estaba en ruinas; ellos le pusieron el nombre, «ciudad de los dioses»."],
[1,"¿Qué escándalo judicial dividió Francia en 1894 en torno a un capitán judío?","El caso Dreyfus.","El artículo «Yo acuso», de Émile Zola, forzó la revisión del juicio."],
[1,"¿Qué general instauró una dictadura en España en 1923, con el visto bueno del rey?","Miguel Primo de Rivera."],
[1,"¿Qué emperador japonés anunció la rendición por radio en 1945?","Hirohito.","Fue la primera vez que los japoneses de a pie oían la voz de su emperador."],
[1,"¿Qué ciudad perdida de los incas dio a conocer Hiram Bingham en 1911?","Machu Picchu.","Nunca fue encontrada por los españoles: por eso llegó intacta."],
[1,"¿Qué tratado entregó a EE. UU. la mitad del territorio mexicano: el de Guadalupe Hidalgo, el de París o el de Gante?","El de Guadalupe Hidalgo, en 1848.","California, Texas, Arizona, Nuevo México… todo por 15 millones de dólares."],
[1,"¿En qué fortaleza del desierto resistieron los últimos rebeldes judíos frente a Roma?","En Masada, junto al mar Muerto.","Antes que rendirse, sus cerca de mil defensores se quitaron la vida."],
[1,"¿Qué príncipe rumano del siglo XV inspiró al personaje de Drácula?","Vlad III, «el Empalador».","Su padre pertenecía a la Orden del Dragón: Drácula significa «hijo del dragón»."],
[1,"¿Qué prohibió la Ley Seca estadounidense entre 1920 y 1933?","Fabricar y vender alcohol.","El gran beneficiado fue el crimen organizado: la era dorada de Al Capone."],
[1,"¿Qué ministro dio nombre a la gran desamortización española de 1836?","Mendizábal.","El Estado subastó los bienes de conventos y monasterios para tapar la deuda."],
[1,"¿Cuántos presidentes tuvo la Primera República española en sus once meses de vida?","Cuatro.","Figueras, Pi y Margall, Salmerón y Castelar: un récord de inestabilidad."],
[1,"¿Qué emperador de Etiopía es venerado por el movimiento rastafari?","Haile Selassie.","Su nombre de nacimiento era Ras Tafari: de ahí la palabra «rastafari»."],
[1,"¿Qué escritura descifró Champollion gracias a la piedra de Rosetta?","Los jeroglíficos egipcios.","La piedra repetía el mismo texto en tres escrituras: esa fue la llave."],
[1,"¿Qué dos países libraron en 1969 la llamada «guerra del fútbol»?","El Salvador y Honduras.","La tensión estalló tras una eliminatoria mundialista, aunque las causas reales venían de lejos."],
[1,"¿Qué reino africano tuvo un ejército de élite formado por mujeres?","Dahomey, en el actual Benín.","Los europeos las llamaron «las amazonas de Dahomey»."],
[1,"¿Quién orbitó la Tierra por primera vez, en 1961?","El soviético Yuri Gagarin.","Su vuelo duró 108 minutos; al ver el planeta dijo: «La Tierra es azul»."],
[1,"¿Qué catástrofe arrasó Londres en 1666?","El Gran Incendio.","Destruyó 13.000 casas pero, de paso, acabó con la peste que asolaba la ciudad."],
[2,"¿Cuál es el elemento más abundante de la corteza terrestre?","El oxígeno: casi la mitad de su peso.","No como gas, sino combinado en rocas, arena y agua."],
[2,"¿Dónde se fabrican los glóbulos rojos?","En la médula ósea.","Produce unos dos millones de glóbulos rojos… por segundo."],
[2,"¿Qué científico descubrió los rayos X?","Wilhelm Röntgen, en 1895.","Recibió el primer Nobel de Física y se negó a patentar el descubrimiento."],
[2,"¿Qué animal terrestre tiene el cerebro más grande?","El elefante: unos 5 kilos.","También es de los pocos animales que se reconocen en un espejo."],
[2,"¿Cuántas cámaras tiene el estómago de una vaca?","Cuatro.","Por eso puede digerir la hierba que a nosotros no nos alimenta."],
[2,"¿En qué planeta está el monte Olimpo, el volcán más alto del sistema solar?","En Marte.","Mide unos 22 km: casi el triple que el Everest."],
[2,"¿Qué químico ruso ordenó los elementos en la tabla periódica?","Dmitri Mendeléyev, en 1869.","Dejó huecos a propósito y predijo los elementos que faltaban: acertó."],
[2,"¿Qué parte del ojo regula la cantidad de luz que entra?","El iris.","La pupila es solo el agujero; el iris es el músculo de color que lo abre y lo cierra."],
[2,"¿Cuál es el ave más pequeña del mundo?","El colibrí zunzuncito, de Cuba.","Pesa unos 2 gramos: menos que una moneda de céntimo."],
[2,"¿Cuál es la más débil de las fuerzas fundamentales de la naturaleza?","La gravedad.","Un imán de nevera la derrota: sostiene un clip contra la atracción de todo el planeta."],
[2,"¿De qué elemento está hecho el ozono?","De oxígeno: moléculas de tres átomos en vez de dos.","Arriba nos protege del sol; a ras de suelo es un contaminante."],
[2,"¿Cuántas veces su propio peso puede cargar una hormiga?","Hasta unas 50 veces.","Sería como si una persona levantara un coche… con los dientes."],
[2,"¿Cuántas veces late el corazón humano en un día?","Unas 100.000.","En una vida media suma más de 2.500 millones de latidos sin descanso."],
[2,"¿Qué científico francés demostró que los microbios causan enfermedades?","Louis Pasteur.","Suyas son la vacuna de la rabia y la pasteurización que lleva su nombre."],
[2,"¿Qué planeta fue degradado a «planeta enano» en 2006?","Plutón.","La votación de los astrónomos indignó a medio mundo; Nuevo México lo declaró planeta por su cuenta."],
[2,"¿Qué animal tiene el ojo más grande del reino animal?","El calamar gigante.","Sus ojos alcanzan 27 cm: como un balón de fútbol."],
[2,"¿Qué mide la escala Beaufort?","La fuerza del viento.","Va de 0 (calma) a 12 (huracán)."],
[2,"¿Cuántas neuronas tiene aproximadamente el cerebro humano?","Unos 86.000 millones.","Más de diez veces la población mundial."],
[2,"¿Qué metal da el color rojo a nuestra sangre?","El hierro, en la hemoglobina."],
[2,"¿Qué famoso cometa se acerca a la Tierra cada 76 años?","El cometa Halley.","La próxima visita será en 2061; su paso de 1910 desató pánico al «gas venenoso» de su cola."],
[2,"¿Cuál es el vertebrado más longevo conocido?","El tiburón de Groenlandia: puede superar los 400 años.","Algún ejemplar vivo podría haber nacido antes que Newton."],
[2,"¿Qué vitamina abunda en los cítricos?","La vitamina C.","Su falta causaba el escorbuto que diezmaba a los marineros; lo curó la Armada británica repartiendo limas."],
[2,"¿Cuántas vértebras tiene el cuello de casi cualquier mamífero, sea un ratón o una jirafa?","Siete.","La jirafa las tiene igual que tú: solo que cada una mide hasta 25 cm."],
[2,"¿Qué glándulas producen la adrenalina?","Las suprarrenales, situadas sobre los riñones."],
[2,"¿Cómo se llama el proceso normal de división de una célula?","Mitosis."],
[2,"¿Qué astro es el principal responsable de las mareas?","La Luna.","El Sol también influye: cuando ambos se alinean llegan las mareas vivas."],
[2,"¿Qué primatóloga pasó décadas conviviendo con los chimpancés en Tanzania?","Jane Goodall.","Descubrió que fabrican y usan herramientas, algo que se creía exclusivamente humano."],
[2,"¿Cuál es el metal más ligero?","El litio.","Flota en el agua… mientras reacciona violentamente con ella."],
[2,"¿Dónde desovan las tortugas marinas?","En la misma playa donde nacieron.","Vuelven a ella tras recorrer miles de kilómetros, guiadas por el campo magnético."],
[2,"¿Qué es incapaz de hacer un caballo: vomitar, sudar o dormir de pie?","Vomitar.","Una válvula muscular se lo impide; por eso los cólicos son tan peligrosos para ellos."],
[2,"¿Qué pueblecito sueco da nombre a cuatro elementos químicos?","Ytterby.","De su mina salieron el itrio, el iterbio, el terbio y el erbio."],
[2,"¿Qué animal produce la seda?","La oruga de una polilla: el gusano de seda.","China guardó el secreto de su cría durante milenios, bajo pena de muerte."],
[2,"¿Cuánta sangre filtran los riñones cada día?","Unos 180 litros.","Casi toda se reabsorbe: solo un litro y medio acaba siendo orina."],
[2,"¿En qué planeta ruge la Gran Mancha Roja?","En Júpiter.","Es una tormenta más grande que la Tierra, activa desde hace al menos 150 años."],
[2,"¿Qué ácido da su sabor al vinagre?","El ácido acético."],
[2,"¿Qué células del ojo nos permiten ver los colores?","Los conos.","Los bastones, sus vecinos, se encargan de la visión nocturna: por eso de noche todo se ve gris."],
[2,"¿Cómo surgió el nombre «Big Bang»?","Lo acuñó con sorna el astrónomo Fred Hoyle… que no creía en la teoría.","El mote burlón funcionó tan bien que se quedó para siempre."],
[2,"¿Qué anfibio mexicano puede regenerar patas, cola e incluso partes del corazón?","El ajolote.","En estado salvaje solo vive en los canales de Xochimilco y está en peligro crítico."],
[2,"¿Qué grupo de insectos representa una de cada cuatro especies animales conocidas?","Los escarabajos.","Hay unas 400.000 especies descritas; preguntado por Dios, un biólogo respondió: «siente debilidad por los escarabajos»."],
[2,"¿Qué físico danés propuso el modelo del átomo con órbitas de electrones?","Niels Bohr.","Durante la ocupación nazi escapó de Dinamarca en una lancha, y luego en un bombardero."],
[2,"¿Qué elemento químico es la base de los chips electrónicos?","El silicio.","De ahí Silicon Valley: «silicona» es una mala traducción clásica."],
[2,"¿Qué valor tiene el cero absoluto, la temperatura más baja posible?","-273,15 °C.","A esa temperatura los átomos alcanzan su mínima energía: no existe nada más frío."],
[2,"¿Qué hay más en tu cuerpo: células humanas o bacterias?","Están prácticamente empatadas, con ligera ventaja para las bacterias.","La mayoría vive en el intestino y muchas son imprescindibles."],
[2,"¿Cómo se llama la explosión con la que muere una estrella masiva?","Supernova.","Durante semanas puede brillar más que toda su galaxia junta."],
[2,"¿Con qué órgano respiran los peces?","Con las branquias."],
[2,"¿Qué físico británico revolucionó el estudio de los agujeros negros desde una silla de ruedas?","Stephen Hawking.","Descubrió que los agujeros negros no son del todo negros: emiten la «radiación de Hawking»."],
[2,"¿Cuál es la articulación más grande del cuerpo humano?","La rodilla."],
[2,"¿Por qué la Luna nos muestra siempre la misma cara?","Porque tarda lo mismo en girar sobre sí misma que en dar la vuelta a la Tierra.","Es la rotación síncrona; la «cara oculta» no se fotografió hasta 1959."],
[2,"¿Qué gas noble ilumina de rojo los letreros luminosos?","El neón.","Los otros colores de los «neones» los dan en realidad otros gases."],
[2,"¿Qué medusa es considerada biológicamente inmortal?","La Turritopsis dohrnii.","Cuando envejece puede revertir a su forma juvenil y empezar de nuevo, en un ciclo sin fin."],
[2,"¿Qué principio físico dice que la energía ni se crea ni se destruye?","La ley de conservación de la energía.","Solo se transforma: de movimiento a calor, de luz a electricidad…"],
[2,"¿En qué órgano se produce la voz humana?","En la laringe, con las cuerdas vocales."],
[2,"¿Qué roedor construye presas capaces de alterar ríos enteros?","El castor.","La mayor conocida, en Canadá, mide 850 metros y se descubrió desde un satélite."],
[2,"¿Qué monje fundó la genética cruzando guisantes en su huerto?","Gregor Mendel.","Publicó sus leyes en 1866 y nadie le hizo caso: la ciencia las redescubrió 35 años después."],
[2,"¿Qué gas es el principal causante del cambio climático de origen humano?","El dióxido de carbono (CO₂)."],
[2,"¿Qué unidad mide la frecuencia?","El hercio (Hz): ciclos por segundo."],
[2,"¿Qué diminuto insecto salta hasta 200 veces su propia longitud?","La pulga.","Equivale a que una persona saltara por encima de la torre Eiffel."],
[2,"¿Qué mineral es el principal componente de huesos y dientes?","El calcio.","El 99 % del calcio del cuerpo está en el esqueleto."],
[2,"¿De qué físico es el famoso gato que está vivo y muerto a la vez?","De Erwin Schrödinger.","Lo propuso justamente para burlarse de lo absurda que parecía la mecánica cuántica."],
[2,"¿Qué nervio conecta el ojo con el cerebro?","El nervio óptico."],
[2,"¿De qué color es la «sangre» de los insectos?","No es roja: es la hemolinfa, amarillenta o verdosa.","No transporta oxígeno; los insectos respiran por tubos llamados tráqueas."],
[2,"¿Qué astrónomo demostró que el universo se expande?","Edwin Hubble, en 1929.","El telescopio espacial bautizado en su honor lleva desde 1990 en órbita."],
[2,"¿Qué elemento marca el ritmo de los relojes atómicos?","El cesio.","El segundo se define oficialmente contando sus vibraciones: 9.192.631.770 exactamente."],
[2,"¿Qué proceso biológico convierte el mosto en vino?","La fermentación, obra de las levaduras.","Son hongos microscópicos que se comen el azúcar y devuelven alcohol."],
[2,"¿Cuáles son los cinco sabores básicos que distingue la lengua?","Dulce, salado, ácido, amargo y umami.","El umami, «sabroso» en japonés, se reconoció oficialmente hace solo unas décadas."],
[2,"¿Qué ave realiza la migración más larga del mundo?","El charrán ártico.","Va del Ártico a la Antártida y vuelve: hasta 70.000 km al año persiguiendo el verano."],
[2,"¿Qué inventor serbio ganó la «guerra de las corrientes» con su corriente alterna?","Nikola Tesla.","Su rival era Edison, que llegó a electrocutar animales en público para desprestigiarla."],
[2,"¿Qué molécula es la «moneda energética» de todas las células?","El ATP.","Tu cuerpo fabrica y gasta cada día una cantidad comparable a su propio peso."],
[2,"¿A través de qué poros microscópicos respiran las hojas de las plantas?","De los estomas."],
[2,"¿Cuál es la sustancia más dura del cuerpo humano?","El esmalte dental.","Más duro que el acero… pero, a diferencia del hueso, no se regenera."],
[2,"¿Dónde tiene que estar el Sol para que veas un arcoíris?","Siempre a tu espalda.","Por eso es imposible acercarse a su final: se mueve contigo."],
[2,"¿Qué planeta tarda 165 años terrestres en dar una vuelta al Sol?","Neptuno.","Desde su descubrimiento en 1846 solo ha completado una órbita."],
[2,"¿Qué partícula del átomo no tiene carga eléctrica?","El neutrón."],
[2,"¿Qué órgano se encarga del equilibrio?","El oído interno.","Por eso el mareo empieza muchas veces por un problema de oído."],
[2,"¿Qué aprendiz de encuadernador sin estudios acabó siendo el gran genio del electromagnetismo?","Michael Faraday.","Einstein tenía su retrato en el despacho, junto a los de Newton y Maxwell."],
[2,"¿Cuál es el único felino que vive en grupo?","El león.","Las manadas son sociedades de hembras: ellas cazan y se quedan; los machos van de paso."],
[2,"¿Qué árbol es el ser vivo no clonal más viejo del mundo?","Un pino longevo de California apodado «Matusalén»: unos 4.850 años.","Ya era un árbol adulto cuando se construyeron las pirámides."],
[2,"¿Por qué lloramos al cortar cebolla?","Porque libera compuestos de azufre que forman un gas irritante al llegar al ojo.","Truco con base científica: cortarla mojada o fría reduce el gas."],
[2,"¿Qué mamífero tiene el embarazo más corto, de unos 13 días?","La zarigüeya.","En el otro extremo está la elefanta: 22 meses."],
[2,"¿Qué científico creó la vacuna de la polio y se negó a patentarla?","Jonas Salk.","Cuando le preguntaron de quién era la patente, respondió: «¿Se puede patentar el sol?»."],
[2,"¿Cómo se orientan los murciélagos en la oscuridad total?","Por ecolocalización: emiten ultrasonidos y escuchan el eco.","No están ciegos: es un mito. Ven, y además tienen sónar."],
[2,"¿Cuál es el pez más grande del mundo?","El tiburón ballena: hasta 18 metros.","Pese al tamaño es inofensivo: se alimenta de plancton."],
[2,"¿En qué fase del sueño se producen la mayoría de los sueños?","En la fase REM.","El cuerpo se paraliza durante ella: probablemente para que no representes lo que sueñas."],
[2,"¿Qué elemento es el culpable del olor a huevo podrido?","El azufre, en forma de sulfuro de hidrógeno."],
[2,"¿Qué ave puede pasar hasta diez meses volando sin posarse?","El vencejo.","Come, duerme e incluso se aparea en el aire."],
[2,"¿Cuántos litros de aire respira una persona al día?","Alrededor de 11.000 litros.","Unas 22.000 respiraciones diarias sin pensarlo ni una vez."],
[2,"¿Qué proyecto internacional completó en 2003 la lectura del ADN humano?","El Proyecto Genoma Humano.","Sorpresa: tenemos unos 20.000 genes, apenas más que una mosca."],
[2,"¿Qué animal australiano duerme hasta 20 horas diarias?","El koala.","Su dieta de eucalipto es tan tóxica y pobre que dormir es su forma de ahorrar energía."],
[2,"¿Qué instrumento mide la humedad del aire?","El higrómetro."],
[2,"¿En qué siglo se midió por primera vez la velocidad de la luz: XVII, XVIII o XIX?","En el XVII: Ole Rømer la estimó en 1676.","Lo logró cronometrando los eclipses de las lunas de Júpiter."],
[2,"¿Qué pez de arrecife puede cambiar de sexo, de macho a hembra?","El pez payaso.","Si muere la hembra dominante, el macho principal se convierte en hembra."],
[2,"¿Qué órgano no puede sentir dolor en sí mismo?","El cerebro: no tiene receptores de dolor.","Por eso hay neurocirugías con el paciente despierto y conversando."],
[2,"¿Cuál es la planta que crece más rápido?","El bambú.","Algunas especies crecen casi un metro al día: se les puede «ver» crecer."],
[2,"¿Qué mide un pluviómetro?","La cantidad de lluvia caída."],
[2,"¿Cuál es el animal más ruidoso del océano?","El cachalote.","Sus chasquidos superan los 230 decibelios: más que el despegue de un cohete."],
[2,"¿Cómo se llama la luz sin calor que emiten las luciérnagas?","Bioluminiscencia.","Su eficiencia es casi del 100 %: la bombilla perfecta que la ingeniería envidia."],
[2,"¿Qué músculo provoca el hipo con sus contracciones involuntarias?","El diafragma.","El récord documentado de hipo continuado es de 68 años."],
[2,"¿Qué glándula del cerebro produce la melatonina, la hormona del sueño?","La glándula pineal.","Descartes creía que era el asiento del alma."],
[2,"¿Qué metal es el mejor conductor de la electricidad?","La plata.","Mejor incluso que el cobre: se usa cobre solo porque es mucho más barato."],
[2,"¿Qué bioquímica española descubrió una enzima clave que copió ADN para media biotecnología mundial?","Margarita Salas.","Su patente fue la más rentable de la historia del CSIC."],
[2,"¿Qué hormona regula el nivel de azúcar en la sangre?","La insulina, producida por el páncreas.","Su falta o mal funcionamiento causa la diabetes."],
[2,"¿Cuál es la estrella más cercana al Sol?","Próxima Centauri, a 4,2 años luz.","Con la nave más rápida construida, tardaríamos miles de años en llegar."],
[2,"¿Cuál es el músculo más fuerte del cuerpo en proporción a su tamaño?","El masetero, el músculo de la mandíbula.","Puede ejercer una presión de unos 90 kilos sobre las muelas."],
[2,"¿Qué ley de los gases relaciona la presión con el volumen?","La ley de Boyle.","A más presión, menos volumen: lo que notas en los oídos al bucear."],
[2,"¿Qué animal incuba su huevo sobre los pies, en pleno invierno antártico?","El pingüino emperador: lo hace el macho.","Aguanta dos meses a -60 °C sin comer, mientras la hembra pesca."],
[2,"¿Qué político y científico estadounidense inventó el pararrayos?","Benjamin Franklin.","Su famoso experimento con la cometa pudo haberle costado la vida."],
[2,"¿Qué elemento se añade a la sal de mesa para prevenir el bocio?","El yodo."],
[2,"¿Cómo se llama el miedo irracional a los espacios cerrados?","Claustrofobia."],
[2,"¿Cuántos huesos tiene una mano humana?","27.","Entre las dos manos suman una cuarta parte de todos los huesos del cuerpo."],
[2,"¿Cómo se llama el proceso de quitar la sal al agua de mar para hacerla potable?","Desalinización.","España es una potencia mundial: cientos de desaladoras, sobre todo en el sureste."],
[2,"¿Qué naturalista sueco inventó el sistema de nombrar especies con dos palabras latinas?","Carlos Linneo.","Por eso somos Homo sapiens: género y especie."],
[2,"¿Cuál es el mayor depredador terrestre del planeta?","El oso polar.","Puede oler una foca a más de un kilómetro y bajo un metro de hielo."],
[2,"¿Cuánto mide el intestino delgado de una persona?","Entre 6 y 7 metros.","Con sus pliegues y vellosidades, su superficie interior ronda los 30 m²: como un pequeño estudio."],
[2,"¿Qué escala mide el picante de los chiles?","La escala Scoville.","Un pimiento morrón marca 0; los récords mundiales superan los dos millones de unidades."],
[2,"¿Qué metal líquido llenaba los termómetros de toda la vida?","El mercurio.","Hoy están prohibidos en la UE por su toxicidad."],
[2,"¿Cuál es la célula más grande del cuerpo humano?","El óvulo.","Es visible a simple vista; la más pequeña es el espermatozoide."],
[2,"¿Qué físico alemán dio nombre a la ley que relaciona voltaje, corriente y resistencia?","Georg Ohm.","La ley de Ohm es la primera lección de cualquier electricista."],
[2,"¿Qué animal microscópico sobrevive al vacío del espacio, la radiación y la congelación?","El tardígrado u «oso de agua».","Ante condiciones extremas se deseca y puede revivir años después con una gota de agua."],
[2,"¿Qué porcentaje del cuerpo humano adulto es agua?","Alrededor del 60 %.","Un recién nacido llega al 75 %."],
[2,"¿De la corteza de qué árbol salió el principio activo de la aspirina?","Del sauce.","Hipócrates ya recetaba infusiones de corteza de sauce contra el dolor."],
[2,"¿Qué palabra griega significa «doble vida» y designa a ranas y salamandras?","Anfibio.","Primero respiran por branquias en el agua; de adultos, por pulmones y piel."],
[2,"¿Alrededor de qué planeta orbita Titán, una luna con lagos y ríos?","De Saturno.","Sus lagos no son de agua, sino de metano líquido."],
[2,"¿Quién escribió en el siglo XIX el primer «programa» informático de la historia?","Ada Lovelace.","Lo escribió para una máquina que nunca llegó a construirse; era hija del poeta Lord Byron."],
[2,"¿Qué matemático británico lideró el descifrado de la máquina Enigma?","Alan Turing.","Se le considera el padre de la informática; el «premio Nobel» de la disciplina lleva su nombre."],
[2,"¿Sirven los antibióticos contra los virus?","No: solo funcionan contra bacterias.","Tomarlos para una gripe no cura y además alimenta las resistencias."],
[2,"¿Qué región del cerebro actúa como termostato del cuerpo?","El hipotálamo.","Del tamaño de una almendra, también gobierna el hambre y la sed."],
[2,"¿Qué gas se conoce como «gas de la risa»?","El óxido nitroso.","Fue la atracción de las fiestas del siglo XIX antes de usarse como anestésico."],
[2,"¿Qué tienen en común la mina de un lápiz y un diamante?","Ambos son carbono puro.","Solo cambia cómo están ordenados los átomos."],
[2,"¿Qué fuerza mantiene unidos los protones en el núcleo del átomo?","La fuerza nuclear fuerte.","Sin ella, los protones se repelerían y no existiría la materia."],
[2,"¿Cada cuántos días hay luna llena?","Cada 29,5 días, aproximadamente.","De ahí viene, precisamente, la palabra «mes»."],
[2,"¿Cómo se llamaba el primer mamífero clonado, presentado en 1996?","La oveja Dolly.","Se llamó así por la cantante Dolly Parton: la clonaron de una célula de glándula mamaria."],
[2,"¿Qué buscaban fabricar los alquimistas con la piedra filosofal?","Oro… y el elixir de la vida eterna.","De sus laboratorios, entre fracaso y fracaso, nació la química moderna."],
[2,"¿A qué velocidad viaja el sonido en el aire?","A unos 343 metros por segundo: 1.234 km/h.","Por eso cuentas segundos entre el rayo y el trueno: cada 3 segundos, un kilómetro."],
[2,"¿Qué ave pone sus huevos en los nidos de otras especies?","El cuco.","El polluelo intruso expulsa a los huevos legítimos y los padres adoptivos no se enteran."],
[2,"¿Qué vitamina es imprescindible para que la sangre coagule?","La vitamina K.","La K viene del alemán Koagulation."],
[2,"¿Qué reptil tiene la mordedura más potente del mundo animal?","El cocodrilo marino.","Su mordisco supera ampliamente al del león o al del tiburón blanco."],
[2,"¿Cómo se llama la ciencia que estudia los fósiles?","La paleontología."],
[2,"¿Qué fenómeno climático calienta el Pacífico cada pocos años y altera el clima mundial?","El Niño.","Lo bautizaron los pescadores peruanos porque solía llegar por Navidad."],
[2,"¿Qué ave australiana es capaz de imitar motosierras, alarmas y cámaras de fotos?","El ave lira.","Imita cualquier sonido de su entorno para adornar su canto de cortejo."],
[2,"¿Qué hueso del cuerpo no está articulado con ningún otro?","El hioides, en el cuello.","Flota sujeto solo por músculos; sostiene la lengua y nos permite hablar."],
[2,"¿Qué ley de Newton explica el retroceso de un cañón al disparar?","La tercera: a toda acción le corresponde una reacción igual y opuesta."],
[2,"¿Cómo comunican las abejas a sus compañeras dónde hay flores?","Bailando: la «danza en ocho».","La dirección y duración del baile codifican el rumbo y la distancia; el hallazgo valió un Nobel."],
[2,"¿Qué órganos se inflaman en una neumonía?","Los pulmones."],
[2,"¿Qué fraile fue quemado en 1600 por defender, entre otras ideas, que había infinitos mundos habitados?","Giordano Bruno.","Su estatua preside hoy la plaza romana donde ardió la hoguera."],
[2,"¿Qué mide el IMC, índice de masa corporal?","La relación entre el peso y la estatura."],
[2,"¿Qué zonas del cuerpo concentran más glándulas sudoríparas?","Las palmas de las manos y las plantas de los pies.","Por eso el sudor frío aparece justo ahí."],
[2,"¿Qué planeta enano orbita en el cinturón de asteroides, entre Marte y Júpiter?","Ceres.","Es tan grande que él solo reúne un tercio de la masa de todo el cinturón."],
[2,"¿Qué principio físico hace que un patinador gire más deprisa al encoger los brazos?","La conservación del momento angular."],
[2,"¿Qué reptil dispara una lengua que puede duplicar la longitud de su cuerpo?","El camaleón.","La lanza en una centésima de segundo: más aceleración que un caza."],
[2,"¿Qué distancia define la «unidad astronómica»?","La distancia media entre la Tierra y el Sol: unos 150 millones de km."],
[2,"¿Qué crustáceo ve el mundo con hasta 16 tipos de fotorreceptores, frente a nuestros 3?","La galera o camarón mantis.","Además golpea con la aceleración de una bala: puede romper el cristal de un acuario."],
[2,"¿Qué elemento químico lleva el nombre de Einstein?","El einstenio.","Se descubrió en los restos de la primera bomba de hidrógeno, en 1952."],
[2,"¿Cuál es el gas noble más abundante en el aire que respiras?","El argón: casi el 1 % de la atmósfera.","Su nombre griego significa «perezoso», porque no reacciona con nada."],
[2,"¿Qué físico italiano inventó la primera pila eléctrica?","Alessandro Volta.","De su apellido viene el voltio; se inspiró en las ancas de rana que hacía saltar Galvani."],
[2,"¿Qué mamífero marino usa piedras como martillo para abrir moluscos?","La nutria marina.","Guarda su piedra favorita en un pliegue de piel, como un bolsillo."],
[2,"¿Cuánta saliva produce una persona al día?","Alrededor de un litro y medio.","A lo largo de la vida suma decenas de miles de litros: una piscina entera."],
[2,"¿Qué exótica lluvia cae, según los modelos científicos, en el interior de Urano y Neptuno?","Lluvia de diamantes.","La presión comprime el metano hasta cristalizarlo en diamante."],
[2,"¿Qué científico español demostró que el cerebro está formado por células individuales?","Santiago Ramón y Cajal.","Nobel en 1906; sus dibujos de neuronas aún ilustran manuales de neurociencia."],
[2,"¿Qué enfermedad de la sangre repartió la reina Victoria entre las casas reales de Europa?","La hemofilia.","Llegó hasta el heredero del zar Nicolás II, con Rasputín como consecuencia inesperada."],
[2,"¿Cuál es el ave que vuela a mayor altura?","El buitre de Rüppell.","El récord lo fijó uno al chocar con un avión… a 11.300 metros."],
[2,"¿Qué alimento no caduca jamás si se conserva sellado?","La miel.","Se ha encontrado miel comestible en tumbas egipcias de 3.000 años."],
[2,"¿Qué sucesión matemática aparece en los girasoles, las piñas y las conchas?","La sucesión de Fibonacci.","Cada número es la suma de los dos anteriores: 1, 1, 2, 3, 5, 8…"],
[2,"¿Qué número expresa la relación entre una circunferencia y su diámetro?","Pi: 3,14159…","Se han calculado billones de decimales; para la NASA bastan 15."],
[2,"¿Cuál es el hueso que más se fractura?","La clavícula.","Es el clásico de las caídas de bici y de hombro."],
[2,"¿Qué animal tiene la vista más aguda del reino animal?","El águila.","Distingue una liebre a más de un kilómetro y ve el ultravioleta."],
[2,"¿Quién inventó la World Wide Web en 1989?","Tim Berners-Lee, en el CERN.","La regaló al mundo sin patente: por eso internet es como es."],
[2,"¿Qué pigmento da su color verde a las plantas?","La clorofila.","En otoño se retira de las hojas y afloran los amarillos y rojos que estaban debajo."],
[2,"¿Qué diminuta rana sudamericana es el vertebrado más venenoso del planeta?","La rana dardo dorada.","Su piel guarda veneno para diez personas; en cautividad, sin su dieta, lo pierde."],
[2,"¿Qué mamífero bucea más profundo?","El zifio de Cuvier.","Se ha registrado una inmersión de casi 3.000 metros y más de tres horas."],
[2,"¿Qué unidad mide la potencia?","El vatio.","Homenajea a James Watt, el perfeccionador de la máquina de vapor."],
[2,"¿Qué le ocurre al agua a 4 °C?","Alcanza su máxima densidad.","Por eso el hielo flota y los lagos se congelan desde arriba: los peces sobreviven debajo."],
[2,"¿De qué animal salvaje desciende el perro?","Del lobo.","Fue domesticado hace al menos 15.000 años: antes que ninguna planta de cultivo."],
[2,"¿Cuántos ojos suelen tener las arañas?","Ocho, como sus patas.","Aun así, la mayoría ve bastante mal: cazan por vibraciones."],
[2,"¿Qué fenómeno predicho por Einstein en 1915 se detectó por fin en 2015?","Las ondas gravitacionales.","Eran arrugas del espacio-tiempo causadas por el choque de dos agujeros negros."],
[2,"¿Qué sonda espacial fue la primera en salir del sistema solar?","La Voyager 1.","Lleva un disco de oro con música y saludos por si alguien la encuentra."],
[2,"¿Qué insectos construyen torres de barro con aire acondicionado natural?","Las termitas.","Sus montículos ventilados han inspirado edificios bioclimáticos reales."],
[2,"¿Qué escala de temperatura empieza justo en el cero absoluto?","La escala Kelvin.","En ella el agua se congela a 273 y hierve a 373."],
[2,"¿Qué mide un electrocardiograma?","La actividad eléctrica del corazón."],
[2,"¿Qué animal planta bosques enteros al olvidar dónde enterró sus bellotas?","La ardilla.","Entierra miles cada otoño y nunca recupera todas: las olvidadas germinan."],
[2,"¿Por qué existen los años bisiestos?","Porque el año real dura 365 días y casi 6 horas.","Cada cuatro años, esas horas suman un día: el 29 de febrero."],
[2,"¿Qué elemento radiactivo trabaja dentro de muchos detectores de humo?","El americio.","Una pizca ioniza el aire; el humo interrumpe la corriente y salta la alarma."],
[2,"¿Cuál es el mamífero más ligero del mundo?","La musaraña etrusca: menos de 2 gramos.","Su corazón late hasta 25 veces por segundo."],
[2,"¿A qué órbita se envían los satélites que parecen fijos en el cielo?","A la órbita geoestacionaria, a unos 36.000 km.","A esa altura tardan en orbitar justo lo que la Tierra en girar: 24 horas."],
[2,"¿De qué material están hechas las perlas?","De nácar, que la ostra segrega en capas.","Nacen de un intruso: la perla es la forma que tiene la ostra de encapsular la molestia."],
[2,"¿Qué astrónoma descubrió los púlsares… y vio cómo el Nobel se lo daban a su director?","Jocelyn Bell.","Al principio llamaron a la señal LGM-1: «little green men», hombrecillos verdes."],
[2,"¿Qué diferencia hay entre un huracán y un tifón?","Ninguna: es el mismo fenómeno.","Huracán en el Atlántico, tifón en el Pacífico occidental, ciclón en el Índico."],
[2,"¿Qué insecto puede sobrevivir semanas sin cabeza?","La cucaracha.","Respira por el cuerpo; al final muere… de sed."],
[2,"¿Qué mide la escala de pH?","El grado de acidez o alcalinidad de una sustancia."],
[2,"¿Cómo se llama la lente natural del ojo humano?","El cristalino.","Cuando se vuelve opaco aparecen las cataratas."],
[2,"¿Qué mamífero americano va cubierto por un caparazón?","El armadillo.","El de nueve bandas pare siempre cuatrillizos genéticamente idénticos."],
[2,"¿Por qué los flamencos son rosas?","Por los pigmentos de los crustáceos y algas que comen.","Nacen grises; en los zoos se les añade pigmento a la dieta para que no palidezcan."],
[2,"¿Qué unidad mide la energía de los alimentos?","La caloría (en realidad, kilocalorías)."],
[2,"¿De qué está hecho el cuerno del rinoceronte?","De queratina: el mismo material que tus uñas.","No tiene hueso: es, literalmente, un mechón de pelo compactado."],
[2,"¿Qué sabio griego saltó de la bañera gritando «¡Eureka!»?","Arquímedes.","Acababa de descubrir cómo medir el volumen de un cuerpo: por el agua que desplaza."],
[2,"¿Qué significa la palabra «láser»?","Son siglas en inglés: amplificación de luz por emisión estimulada de radiación."],

[4,"¿En qué película Patrick Swayze avisa de que «nadie arrincona a Baby»?","Dirty Dancing.","El salto final se ha recreado en mil bodas… con resultados dispares."],

[4,"¿Qué pareja cómica es conocida en España como «el Gordo y el Flaco»?","Laurel y Hardy (Stan Laurel y Oliver Hardy)."],

[4,"¿Qué actor protagonizó «El show de Truman»?","Jim Carrey.","«Por si no nos vemos luego: buenos días, buenas tardes y buenas noches»."],
[4,"¿Qué director italiano recogió su Óscar por «La vida es bella» caminando sobre las butacas?","Roberto Benigni.","Ganó como mejor actor y mejor película extranjera por una comedia sobre el Holocausto."],

[5,"¿En qué año se publicó la primera parte del Quijote?","En 1605.","La segunda llegó en 1615, en parte para desmentir una continuación pirata: el «Quijote de Avellaneda»."],
[5,"¿Quién escribió «Cien años de soledad»?","Gabriel García Márquez.","Arranca con el pelotón de fusilamiento y el hielo: uno de los comienzos más famosos del siglo XX."],

// Estado
let order = Q.map((_, i) => i);
let filtered = order.slice();
let pos = 0;
let revealed = false;
let activeCat = "all";

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function applyFilter() {
  filtered = activeCat === "all"
    ? order.slice()
    : order.filter(i => Q[i][0] === Number(activeCat));
  pos = 0;
  revealed = false;
  render();
}

function render() {
  const idx = filtered[pos];
  const [c, q, a, fact] = Q[idx];
  const cat = CATS[c];
  document.getElementById("card").style.setProperty("--cat-color", `var(${cat.varName})`);
  document.getElementById("cat").textContent = cat.name;
  document.getElementById("question").textContent = q;
  const ans = document.getElementById("answer");
  ans.textContent = "";
  if (revealed) {
    ans.classList.remove("hidden-answer");
    ans.append(a);
    if (fact) {
      const f = document.createElement("div");
      f.className = "fact";
      f.textContent = "✦ " + fact;
      ans.append(f);
    }
  } else {
    ans.classList.add("hidden-answer");
    ans.textContent = "Toca la tarjeta o pulsa «Ver respuesta»";
  }
  document.getElementById("counter").textContent = `${pos + 1} / ${filtered.length}`;
  document.getElementById("reveal").textContent = revealed ? "Ocultar respuesta" : "Ver respuesta";
}

function move(delta) {
  pos = (pos + delta + filtered.length) % filtered.length;
  revealed = false;
  render();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}

document.getElementById("prev").addEventListener("click", () => move(-1));
document.getElementById("next").addEventListener("click", () => move(1));
document.getElementById("reveal").addEventListener("click", toggleReveal);
document.getElementById("card").addEventListener("click", toggleReveal);
document.getElementById("card").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); toggleReveal(); }
});
document.getElementById("shuffle").addEventListener("click", () => {
  shuffle(order);
  applyFilter();
});

document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  activeCat = btn.dataset.cat;
  document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("active", b === btn));
  applyFilter();
});

document.addEventListener("keydown", e => {
  if (e.target.closest("button, input")) return;
  if (document.getElementById("setup").hidden === false) return;
  if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "ArrowRight") move(1);
  else if (e.key === " ") { e.preventDefault(); toggleReveal(); }
});

// ——— Jugadores y marcador ———
let players = [];

function loadPlayers() {
  try {
    const raw = localStorage.getItem("trivialMarcadorPlayers");
    if (raw) players = JSON.parse(raw).filter(p => p && p.name);
  } catch (e) { /* almacenamiento no disponible: se juega sin guardar */ }
}
function savePlayers() {
  try { localStorage.setItem("trivialMarcadorPlayers", JSON.stringify(players)); } catch (e) {}
}

function fmtScore(n) {
  const v = Math.round(n * 10) / 10;
  return String(v).replace(".", ",");
}

function renderScores() {
  const box = document.getElementById("scores");
  box.textContent = "";
  const max = Math.max(...players.map(p => p.score));
  players.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "player" + (players.length > 1 && p.score === max && p.score !== 0 ? " leader" : "");
    const row = document.createElement("div");
    row.className = "prow";
    const name = document.createElement("span");
    name.className = "pname";
    name.textContent = p.name;
    const score = document.createElement("span");
    score.className = "pscore";
    score.textContent = fmtScore(p.score);
    row.append(name, score);
    const btns = document.createElement("div");
    btns.className = "pbtns";
    for (const [label, delta] of [["+1", 1], ["+½", 0.5], ["−½", -0.5], ["−1", -1]]) {
      const b = document.createElement("button");
      b.textContent = label;
      b.className = delta > 0 ? "plus" : "minus";
      b.setAttribute("aria-label", `${label} para ${p.name}`);
      b.addEventListener("click", () => {
        p.score = Math.round((p.score + delta) * 10) / 10;
        savePlayers();
        renderScores();
      });
      btns.append(b);
    }
    div.append(row, btns);
    box.append(div);
  });
}

function renderChips() {
  const list = document.getElementById("chiplist");
  list.textContent = "";
  players.forEach((p, i) => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.type = "button";
    chip.textContent = p.name;
    chip.addEventListener("click", () => {
      players.splice(i, 1);
      renderChips();
    });
    list.append(chip);
  });
  document.getElementById("startGame").disabled = players.length === 0;
  document.getElementById("resetScores").hidden = !players.some(p => p.score !== 0);
}

function addPlayerFromInput() {
  const input = document.getElementById("nameInput");
  const name = input.value.trim();
  if (!name) return;
  if (players.length >= 12 || players.some(p => p.name.toLowerCase() === name.toLowerCase())) { input.select(); return; }
  players.push({ name, score: 0 });
  input.value = "";
  input.focus();
  renderChips();
}

function openSetup() {
  document.getElementById("setup").hidden = false;
  renderChips();
  document.getElementById("nameInput").focus();
}
function closeSetup() {
  document.getElementById("setup").hidden = true;
  savePlayers();
  renderScores();
}

document.getElementById("addPlayer").addEventListener("click", addPlayerFromInput);
document.getElementById("nameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); addPlayerFromInput(); }
});
document.getElementById("startGame").addEventListener("click", closeSetup);
document.getElementById("resetScores").addEventListener("click", () => {
  players.forEach(p => p.score = 0);
  renderChips();
});
document.getElementById("editPlayers").addEventListener("click", openSetup);

shuffle(order);
applyFilter();
loadPlayers();
if (players.length === 0) {
  // Jugadores por defecto: un toque en «Empezar» y a jugar
  players = ["Julen", "Goyene", "Mella", "Luis"].map(name => ({ name, score: 0 }));
  openSetup();
} else {
  renderScores();
}
</script>
